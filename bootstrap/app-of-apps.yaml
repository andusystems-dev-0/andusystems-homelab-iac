# Root "app-of-apps" — ArgoCD self-manages every child Application under apps/*/application.yaml.
# Applied once at bootstrap (ansible); thereafter ArgoCD keeps the fleet in sync from GitHub.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/andusystems-dev-0/andusystems-homelab-iac.git
    targetRevision: HEAD
    path: apps
    directory:
      recurse: true
      include: "*/application.yaml"
  destination:
    name: in-cluster
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

# Allow ingress only from trusted namespaces (Traefik/kube-system, Prometheus, ArgoCD) + same-ns.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-trusted-ingress
  namespace: cert-manager
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: prometheus } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: argocd } }
        - podSelector: {}
---

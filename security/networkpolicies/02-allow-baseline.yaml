# Allow ingress from within the cluster + LAN (pods 10.42/16, services 10.43/16, nodes,
# workstation) via the private 10.0.0.0/8 range; still DENIES public-internet ingress
# (paired with 01-default-deny). NetworkPolicy can't select the kube-apiserver by
# namespace, so an ipBlock is required for control-plane -> webhook/pod traffic.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intracluster-ingress
  namespace: cert-manager
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: { cidr: 10.0.0.0/8 }
---

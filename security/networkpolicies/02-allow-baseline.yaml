# Allow intra-cluster + LAN ingress (10.0.0.0/8); denies public internet. See commit history for rationale.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intracluster-ingress
  namespace: metallb-system
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: { cidr: 10.0.0.0/8 }
---

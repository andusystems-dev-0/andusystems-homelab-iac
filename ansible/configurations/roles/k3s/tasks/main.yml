---
- name: Wait for cloud-init to finish (fresh boot still runs apt → lock races)
  ansible.builtin.command: cloud-init status --wait
  changed_when: false
  failed_when: false

- name: Wait for apt/dpkg locks to clear
  ansible.builtin.shell: |
    for i in $(seq 1 60); do
      fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/lib/dpkg/lock >/dev/null 2>&1 || exit 0
      sleep 5
    done
    exit 0
  changed_when: false

- name: Longhorn prerequisites (open-iscsi + nfs-common) on all nodes
  ansible.builtin.apt:
    name: [open-iscsi, nfs-common]
    state: present
    update_cache: true
  register: apt_longhorn
  retries: 10
  delay: 15
  until: apt_longhorn is succeeded

- name: Ensure iscsid is enabled and running (Longhorn engine)
  ansible.builtin.systemd:
    name: iscsid
    enabled: true
    state: started

- name: Install Docker on game nodes (Wings needs the Docker daemon)
  when: inventory_hostname in game_nodes
  ansible.builtin.shell: |
    set -e
    if ! command -v docker >/dev/null 2>&1; then curl -fsSL https://get.docker.com | sh; fi
  args:
    creates: /usr/bin/docker

- name: Ensure FORWARD policy ACCEPT on Docker nodes (Docker sets it DROP → breaks k3s pod forwarding)
  when: inventory_hostname in game_nodes
  ansible.builtin.iptables:
    chain: FORWARD
    policy: ACCEPT

- name: Install k3s on the first server (cluster-init)
  when: inventory_hostname == groups['k3s_servers'][0]
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ k3s_version }}" \
      INSTALL_K3S_EXEC="server --cluster-init --disable local-storage --disable servicelb --write-kubeconfig-mode 644" sh -
  args:
    creates: /usr/local/bin/k3s-uninstall.sh

- name: Read node token from the first server
  when: inventory_hostname == groups['k3s_servers'][0]
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_token_b64

- name: Publish the join token to all hosts
  ansible.builtin.set_fact:
    k3s_token: "{{ hostvars[groups['k3s_servers'][0]]['k3s_token_b64']['content'] | b64decode | trim }}"
    k3s_first_ip: "{{ hostvars[groups['k3s_servers'][0]]['ansible_host'] }}"

- name: Join the remaining servers
  when: inventory_hostname in groups['k3s_servers'][1:]
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ k3s_version }}" \
      K3S_TOKEN="{{ k3s_token }}" \
      INSTALL_K3S_EXEC="server --server https://{{ k3s_first_ip }}:6443 --disable local-storage --disable servicelb --write-kubeconfig-mode 644" sh -
  args:
    creates: /usr/local/bin/k3s-uninstall.sh

- name: Join the agents
  when: inventory_hostname in groups['k3s_agents']
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ k3s_version }}" \
      K3S_URL="https://{{ k3s_first_ip }}:6443" K3S_TOKEN="{{ k3s_token }}" sh -
  args:
    creates: /usr/local/bin/k3s-agent-uninstall.sh

- name: Wait for all nodes to register with the API (agents join a few seconds after k3s starts)
  when: inventory_hostname == groups['k3s_servers'][0]
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  ansible.builtin.command: "kubectl get node {{ item }}"
  loop: "{{ groups['k3s_servers'] + groups['k3s_agents'] }}"
  register: node_reg
  until: node_reg.rc == 0
  retries: 30
  delay: 10
  changed_when: false

- name: Label game nodes (Wings) and bulk-storage nodes (Longhorn)
  when: inventory_hostname == groups['k3s_servers'][0]
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  ansible.builtin.shell: |
    kubectl label node {{ game_nodes | join(' ') }} role=games --overwrite
    kubectl label node {{ bulk_nodes | join(' ') }} storage=bulk --overwrite
    kubectl label node {{ perf_game_nodes | join(' ') }} cpu-tier=performance --overwrite
    kubectl label node {{ capacity_game_nodes | join(' ') }} cpu-tier=capacity --overwrite
  changed_when: true

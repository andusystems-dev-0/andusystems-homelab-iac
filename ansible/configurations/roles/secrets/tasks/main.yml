---
# Injects secrets from the gitignored vault into the cluster as k8s Secrets, so the
# PUBLIC GitOps repo never contains any. ArgoCD apps reference these by name.
- name: Ensure namespaces that hold pre-created secrets
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  ansible.builtin.shell: |
    for ns in cert-manager newt pihole observability vaultwarden longhorn-system jellyfin; do
      kubectl create namespace "$ns" --dry-run=client -o yaml | kubectl apply -f -
    done
  changed_when: true

- name: Cloudflare API token (cert-manager)
  no_log: true
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  ansible.builtin.shell: >
    kubectl create secret generic cloudflare-api-token -n cert-manager
    --from-literal=api-token='{{ cloudflare_api_token }}'
    --dry-run=client -o yaml | kubectl apply -f -
  changed_when: true

- name: Pangolin Newt credentials (newt)
  no_log: true
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  ansible.builtin.shell: >
    kubectl create secret generic newt-credentials -n newt
    --from-literal=newt-endpoint='{{ newt_endpoint }}'
    --from-literal=newt-id='{{ newt_id }}'
    --from-literal=newt-secret='{{ newt_secret }}'
    --dry-run=client -o yaml | kubectl apply -f -
  changed_when: true

- name: Pi-hole / Grafana / Vaultwarden admin secrets
  no_log: true
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  ansible.builtin.shell: |
    kubectl create secret generic pihole-admin -n pihole \
      --from-literal=password='{{ pihole_admin_password }}' --dry-run=client -o yaml | kubectl apply -f -
    kubectl create secret generic grafana-admin -n observability \
      --from-literal=admin-user=admin --from-literal=admin-password='{{ grafana_admin_password }}' --dry-run=client -o yaml | kubectl apply -f -
    kubectl create secret generic vaultwarden-admin -n vaultwarden \
      --from-literal=token='{{ vaultwarden_admin_token }}' --dry-run=client -o yaml | kubectl apply -f -
  changed_when: true

- name: Uptime-Kuma admin secret (uptime-kuma)
  no_log: true
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  ansible.builtin.shell: |
    kubectl create namespace uptime-kuma --dry-run=client -o yaml | kubectl apply -f -
    kubectl create secret generic uptime-kuma-admin -n uptime-kuma \
      --from-literal=username=admin --from-literal=password='{{ uptime_kuma_admin_password }}' \
      --dry-run=client -o yaml | kubectl apply -f -
  changed_when: true

- name: Longhorn S3 backup credentials (longhorn-system)
  no_log: true
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  ansible.builtin.shell: >
    kubectl create secret generic longhorn-backup-creds -n longhorn-system
    --from-literal=AWS_ACCESS_KEY_ID='{{ longhorn_aws_access_key_id }}'
    --from-literal=AWS_SECRET_ACCESS_KEY='{{ longhorn_aws_secret_access_key }}'
    --dry-run=client -o yaml | kubectl apply -f -
  changed_when: true

# --- Longhorn-first + restore ----------------------------------------------------------
# Sync Longhorn AHEAD of the rest of the fleet so cluster PVC data can be restored from S3
# BEFORE the data apps create their PVCs. Without this ordering, apps would provision empty
# volumes and the restore would be too late. Safe/no-op on a first-ever deploy (no backups).
- name: Render the Jellyfin media NFS PV/PVC (NAS IP from the gitignored vault)
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  ansible.builtin.template:
    src: jellyfin-media-nfs.yaml.j2
    dest: /tmp/jellyfin-media-nfs.yaml
    mode: "0600"

- name: kubectl apply the Jellyfin media NFS PV/PVC (binds jellyfin to the persistent NAS)
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  ansible.builtin.command: kubectl apply -f /tmp/jellyfin-media-nfs.yaml
  changed_when: true

- name: Stage the Longhorn Application (synced ahead of the root app-of-apps)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../apps/longhorn/application.yaml"
    dest: /tmp/longhorn-application.yaml
    mode: "0600"

- name: kubectl apply the Longhorn Application (before the fleet)
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  ansible.builtin.command: kubectl apply -f /tmp/longhorn-application.yaml
  changed_when: true

- name: Wait for the Longhorn StorageClass (CSI provisioning is ready)
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  ansible.builtin.command: kubectl get storageclass longhorn
  register: lh_sc
  until: lh_sc.rc == 0
  retries: 40
  delay: 15
  changed_when: false
  # ~10 min budget for ArgoCD to reconcile the Longhorn app + install its CSI/CRDs

- name: Wait for the Longhorn CSI provisioner + attacher to be Available
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  ansible.builtin.command: >
    kubectl -n longhorn-system wait --for=condition=Available
    deploy/csi-provisioner deploy/csi-attacher --timeout=300s
  changed_when: false
  failed_when: false

- name: Restore cluster PVC data from the Longhorn S3 backup store
  # Creates a restored Longhorn volume + a pre-bound PV (claimRef) for every backup, so the
  # apps below bind to restored data instead of empty volumes. No-op if the store is empty.
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  ansible.builtin.script: "{{ playbook_dir }}/../scripts/restore-longhorn.sh"
  register: lh_restore
  changed_when: "'restored,' in (lh_restore.stdout | default(''))"

- name: Show Longhorn restore output
  ansible.builtin.debug:
    msg: "{{ lh_restore.stdout_lines | default(['(no output)']) }}"

- name: Apply the root app-of-apps (ArgoCD takes over the fleet)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../bootstrap/app-of-apps.yaml"
    dest: /tmp/app-of-apps.yaml
    mode: "0600"

- name: kubectl apply root app-of-apps
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  ansible.builtin.shell: kubectl apply -f /tmp/app-of-apps.yaml
  changed_when: true

- name: Wait for the cert-manager ClusterIssuer CRD to APPEAR (ArgoCD syncs cert-manager)
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  ansible.builtin.command: kubectl get crd clusterissuers.cert-manager.io
  register: ci_crd
  until: ci_crd.rc == 0
  retries: 40
  delay: 15
  changed_when: false
  # ~10 min budget for ArgoCD to reconcile the root app → cert-manager → its CRDs

- name: Wait for the ClusterIssuer CRD to be Established
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  ansible.builtin.command: kubectl wait --for=condition=Established crd/clusterissuers.cert-manager.io --timeout=120s
  changed_when: false

- name: Render + apply the Let's Encrypt ClusterIssuer
  ansible.builtin.template:
    src: clusterissuer.yaml.j2
    dest: /tmp/clusterissuer.yaml
    mode: "0600"

- name: kubectl apply ClusterIssuer (retry until cert-manager webhook is ready)
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  ansible.builtin.command: kubectl apply -f /tmp/clusterissuer.yaml
  register: ci_apply
  until: ci_apply.rc == 0
  retries: 20
  delay: 15
  changed_when: true

- name: Wait for the MetalLB IPAddressPool CRD (ArgoCD installs MetalLB)
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  ansible.builtin.command: kubectl get crd ipaddresspools.metallb.io
  register: mlb_crd
  until: mlb_crd.rc == 0
  retries: 40
  delay: 15
  changed_when: false

- name: Wait for the MetalLB controller (serves the validating webhook) to be Available
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  ansible.builtin.command: >
    kubectl -n metallb-system wait --for=condition=Available deploy
    -l app.kubernetes.io/component=controller --timeout=240s
  changed_when: false
  failed_when: false

- name: Render + apply the MetalLB pool (IP range from gitignored vault)
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  ansible.builtin.template:
    src: metallb-pool.yaml.j2
    dest: /tmp/metallb-pool.yaml
    mode: "0600"

- name: kubectl apply MetalLB pool (retry until the webhook has endpoints)
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  ansible.builtin.command: kubectl apply -f /tmp/metallb-pool.yaml
  register: mlb_apply
  until: mlb_apply.rc == 0
  retries: 20
  delay: 15
  changed_when: true

- name: Wait for the Longhorn RecurringJob CRD (ArgoCD installs Longhorn)
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  ansible.builtin.command: kubectl get crd recurringjobs.longhorn.io
  register: lh_crd
  until: lh_crd.rc == 0
  retries: 40
  delay: 15
  changed_when: false

- name: Apply the Longhorn backup RecurringJob (nightly, 14 restore points, group=default)
  # Every PVC is auto-added to Longhorn's `default` recurring-job group, so this one job
  # snapshots + backs up the whole cluster's data to S3. Retries until the CRD webhook is up.
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  ansible.builtin.shell: |
    cat <<'YAML' | kubectl apply -f -
    apiVersion: longhorn.io/v1beta2
    kind: RecurringJob
    metadata:
      name: backup-daily
      namespace: longhorn-system
    spec:
      name: backup-daily
      cron: "0 3 * * *"
      task: backup
      groups: [default]
      retain: 14
      concurrency: 2
    YAML
  register: lh_rj
  until: lh_rj.rc == 0
  retries: 20
  delay: 15
  changed_when: true

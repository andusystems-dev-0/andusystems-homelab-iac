---
# Injects secrets from the gitignored vault into the cluster as k8s Secrets, so the
# PUBLIC GitOps repo never contains any. ArgoCD apps reference these by name.
- name: Ensure namespaces that hold pre-created secrets
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  ansible.builtin.shell: |
    for ns in cert-manager newt pihole observability vaultwarden; do
      kubectl create namespace "$ns" --dry-run=client -o yaml | kubectl apply -f -
    done
  changed_when: true

- name: Cloudflare API token (cert-manager)
  no_log: true
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  ansible.builtin.shell: >
    kubectl create secret generic cloudflare-api-token -n cert-manager
    --from-literal=api-token='{{ cloudflare_api_token }}'
    --dry-run=client -o yaml | kubectl apply -f -
  changed_when: true

- name: Pangolin Newt credentials (newt)
  no_log: true
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  ansible.builtin.shell: >
    kubectl create secret generic newt-credentials -n newt
    --from-literal=newt-endpoint='{{ newt_endpoint }}'
    --from-literal=newt-id='{{ newt_id }}'
    --from-literal=newt-secret='{{ newt_secret }}'
    --dry-run=client -o yaml | kubectl apply -f -
  changed_when: true

- name: Pi-hole / Grafana / Vaultwarden admin secrets
  no_log: true
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  ansible.builtin.shell: |
    kubectl create secret generic pihole-admin -n pihole \
      --from-literal=password='{{ pihole_admin_password }}' --dry-run=client -o yaml | kubectl apply -f -
    kubectl create secret generic grafana-admin -n observability \
      --from-literal=admin-user=admin --from-literal=admin-password='{{ grafana_admin_password }}' --dry-run=client -o yaml | kubectl apply -f -
    kubectl create secret generic vaultwarden-admin -n vaultwarden \
      --from-literal=token='{{ vaultwarden_admin_token }}' --dry-run=client -o yaml | kubectl apply -f -
  changed_when: true

- name: Apply the root app-of-apps (ArgoCD takes over the fleet)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../bootstrap/app-of-apps.yaml"
    dest: /tmp/app-of-apps.yaml
    mode: "0600"

- name: kubectl apply root app-of-apps
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  ansible.builtin.shell: kubectl apply -f /tmp/app-of-apps.yaml
  changed_when: true

- name: Wait for the cert-manager ClusterIssuer CRD to APPEAR (ArgoCD syncs cert-manager)
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  ansible.builtin.command: kubectl get crd clusterissuers.cert-manager.io
  register: ci_crd
  until: ci_crd.rc == 0
  retries: 40
  delay: 15
  changed_when: false
  # ~10 min budget for ArgoCD to reconcile the root app → cert-manager → its CRDs

- name: Wait for the ClusterIssuer CRD to be Established
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  ansible.builtin.command: kubectl wait --for=condition=Established crd/clusterissuers.cert-manager.io --timeout=120s
  changed_when: false

- name: Render + apply the Let's Encrypt ClusterIssuer
  ansible.builtin.template:
    src: clusterissuer.yaml.j2
    dest: /tmp/clusterissuer.yaml
    mode: "0600"

- name: kubectl apply ClusterIssuer (retry until cert-manager webhook is ready)
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  ansible.builtin.command: kubectl apply -f /tmp/clusterissuer.yaml
  register: ci_apply
  until: ci_apply.rc == 0
  retries: 20
  delay: 15
  changed_when: true

- name: Wait for the MetalLB IPAddressPool CRD (ArgoCD installs MetalLB)
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  ansible.builtin.command: kubectl get crd ipaddresspools.metallb.io
  register: mlb_crd
  until: mlb_crd.rc == 0
  retries: 40
  delay: 15
  changed_when: false

- name: Wait for the MetalLB controller (serves the validating webhook) to be Available
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  ansible.builtin.command: >
    kubectl -n metallb-system wait --for=condition=Available deploy
    -l app.kubernetes.io/component=controller --timeout=240s
  changed_when: false
  failed_when: false

- name: Render + apply the MetalLB pool (IP range from gitignored vault)
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  ansible.builtin.template:
    src: metallb-pool.yaml.j2
    dest: /tmp/metallb-pool.yaml
    mode: "0600"

- name: kubectl apply MetalLB pool (retry until the webhook has endpoints)
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  ansible.builtin.command: kubectl apply -f /tmp/metallb-pool.yaml
  register: mlb_apply
  until: mlb_apply.rc == 0
  retries: 20
  delay: 15
  changed_when: true

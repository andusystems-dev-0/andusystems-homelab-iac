---
# Actions Runner Controller (ARC) — installs a self-hosted GHA runner INTO the
# cluster during the one-time seed. Thereafter GHA workflows (deploy/infra) run
# here on your servers; the workstation is no longer needed for deploys.
- name: Namespaces for ARC
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  ansible.builtin.shell: |
    for ns in arc-systems arc-runners; do
      kubectl create namespace "$ns" --dry-run=client -o yaml | kubectl apply -f -
    done
  changed_when: true

- name: GitHub PAT secret for the runner (repo scope)
  no_log: true
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  ansible.builtin.shell: >
    kubectl create secret generic github-runner-pat -n arc-runners
    --from-literal=github_token='{{ github_runner_pat }}'
    --dry-run=client -o yaml | kubectl apply -f -
  changed_when: true

- name: Install ARC controller
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  ansible.builtin.shell: |
    helm upgrade --install arc \
      oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set-controller \
      -n arc-systems --wait --timeout 5m
  changed_when: true

- name: Install the homelab runner scale set (registers runs-on label)
  environment: { KUBECONFIG: /etc/rancher/k3s/k3s.yaml }
  ansible.builtin.shell: |
    helm upgrade --install homelab-iac \
      oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set \
      -n arc-runners \
      --set githubConfigUrl="https://github.com/andusystems-dev-0/andusystems-homelab-iac" \
      --set githubConfigSecret=github-runner-pat \
      --set runnerScaleSetName="self-hosted-homelab-iac" \
      --set minRunners=1 --set maxRunners=3 \
      --wait --timeout 5m
  changed_when: true

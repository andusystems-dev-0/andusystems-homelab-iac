---
- name: Install ArgoCD via Helm (TLS terminated at Traefik → insecure server)
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  ansible.builtin.shell: |
    set -e
    helm repo add argo https://argoproj.github.io/argo-helm >/dev/null 2>&1 || true
    helm repo update argo >/dev/null
    helm upgrade --install argocd argo/argo-cd -n argocd --create-namespace \
      --set 'configs.params.server\.insecure=true' \
      --wait --timeout 10m
  changed_when: true

- name: Wait for ArgoCD Application CRD to be established
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  ansible.builtin.shell: kubectl wait --for=condition=Established crd/applications.argoproj.io --timeout=120s
  changed_when: false

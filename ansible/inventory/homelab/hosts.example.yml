# Copy to hosts.yml (gitignored) and set your real node IPs.
all:
  vars:
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ~/.ssh/proxmox_ed25519
  children:
    k3s_servers:
      hosts:
        homelab-k3s-1: { ansible_host: 10.0.0.11 }
        homelab-k3s-2: { ansible_host: 10.0.0.12 }
        homelab-k3s-3: { ansible_host: 10.0.0.13 }
    k3s_agents:
      hosts:
        homelab-k3s-4: { ansible_host: 10.0.0.14 }

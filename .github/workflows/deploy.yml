name: deploy
# FULL RECREATE pipeline on the persistent off-cluster runner (homelab-ops):
#   deploy  = terraform DESTROY layer-1 -> APPLY -> k3s -> ArgoCD (fresh cluster every run)
#   destroy = terraform DESTROY layer-1 only (teardown)
# The runner is layer-0 (separate state), so it is never touched. Rolling/incremental
# updates will live in separate pipelines; this one always rebuilds from scratch.
# Secrets are reconstructed per-run from repo Actions secrets (nothing committed).
on:
  workflow_dispatch:
    inputs:
      action:
        description: "deploy = destroy+recreate everything; destroy = teardown only"
        type: choice
        options: [deploy, destroy]
        default: deploy

concurrency:
  group: homelab-infra
  cancel-in-progress: false

env:
  TF_DIR: terraform/layers/layer-1-infrastructure
  STATE: /opt/homelab/tfstate/layer-1.tfstate
  KEY: /opt/homelab/keys/proxmox_key

jobs:
  lifecycle:
    runs-on: [self-hosted, homelab-ops]
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct secrets from Actions secrets
        # Pass secrets via env (NOT inline ${{ }}) so quotes/special chars in the
        # content can't break shell quoting.
        env:
          S_KEY: ${{ secrets.PROXMOX_SSH_KEY }}
          S_TFVARS: ${{ secrets.TFVARS }}
          S_VAULT: ${{ secrets.ANSIBLE_VAULT }}
          S_HOSTS: ${{ secrets.ANSIBLE_HOSTS }}
        run: |
          mkdir -p /opt/homelab/keys && chmod 700 /opt/homelab/keys
          printf '%s\n' "$S_KEY"  > "$KEY" && chmod 600 "$KEY"   # trailing newline: OpenSSH keys require it
          # derive the public key on the runner (workstation's .pub path doesn't exist here)
          ssh-keygen -y -f "$KEY" > "$KEY.pub"
          printf '%s' "$S_TFVARS" > "$TF_DIR/terraform.tfvars"
          printf '%s' "$S_VAULT"  > ansible/inventory/homelab/group_vars/all/vault
          printf '%s' "$S_HOSTS"  > ansible/inventory/homelab/hosts.yml

      - name: Terraform init (persistent local state)
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false -backend-config="path=$STATE"

      - name: Terraform destroy (always — fresh every run)
        working-directory: ${{ env.TF_DIR }}
        run: terraform destroy -auto-approve -input=false -var "proxmox_ssh_private_key_path=$KEY" -var "ssh_public_key_path=$KEY.pub"

      - name: Terraform apply (provision fresh VMs)
        if: ${{ inputs.action == 'deploy' }}
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve -input=false -var "proxmox_ssh_private_key_path=$KEY" -var "ssh_public_key_path=$KEY.pub"

      - name: Wait for cloud-init + SSH
        if: ${{ inputs.action == 'deploy' }}
        run: sleep 90

      - name: Ansible — install k3s
        if: ${{ inputs.action == 'deploy' }}
        working-directory: ansible
        run: ansible-playbook site.yml --tags k3s --limit 'k3s_servers:k3s_agents' --private-key "$KEY" -e "ansible_ssh_private_key_file=$KEY"

      - name: Ansible — ArgoCD + secrets + app-of-apps
        if: ${{ inputs.action == 'deploy' }}
        working-directory: ansible
        run: ansible-playbook site.yml --tags gitops --limit 'k3s_servers[0]' --private-key "$KEY" -e "ansible_ssh_private_key_file=$KEY"

      - name: Scrub reconstructed secrets
        if: always()
        run: |
          rm -f "$TF_DIR/terraform.tfvars" ansible/inventory/homelab/group_vars/all/vault ansible/inventory/homelab/hosts.yml
          # keep $KEY (persistent, 600) for subsequent runs; remove if you prefer per-run only

# abcde config for hands-off CD ripping into the Jellyfin music library (host-side rip).
# Runs on the Proxmox host that has the optical drive (QEMU passthrough can't read audio CDs),
# writing FLAC to the NAS mounted at /mnt/media. Layout is Jellyfin-friendly:
#   /mnt/media/music/<Artist>/<Album>/NN Track.flac
CDROM=/dev/sr0
OUTPUTTYPE=flac
FLACOPTS='--best'
OUTPUTDIR=/mnt/media/music
WAVOUTPUTDIR=/var/tmp
ACTIONS=cddb,read,encode,tag,move,clean
CDDBMETHOD=musicbrainz
OUTPUTFORMAT='${ARTISTFILE}/${ALBUMFILE}/${TRACKNUM} ${TRACKFILE}'
VAOUTPUTFORMAT='Various Artists/${ALBUMFILE}/${TRACKNUM} ${ARTISTFILE} - ${TRACKFILE}'
PADTRACKS=y
MAXPROCS=4
EJECTCD=n
INTERACTIVE=n

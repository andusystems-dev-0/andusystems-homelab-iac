# abcde config for hands-off CD ripping into the Jellyfin music library.
# FLAC (lossless archive) + MusicBrainz tags, laid out the way Jellyfin likes:
#   /srv/media/music/<Artist>/<Album>/NN Track.flac
CDROM=/dev/sr0
OUTPUTTYPE=flac
FLACOPTS='--best'
OUTPUTDIR=/srv/media/music
ACTIONS=cddb,read,encode,tag,move,clean
CDDBMETHOD=musicbrainz
OUTPUTFORMAT='${ARTISTFILE}/${ALBUMFILE}/${TRACKNUM} ${TRACKFILE}'
VAOUTPUTFORMAT='Various Artists/${ALBUMFILE}/${TRACKNUM} ${ARTISTFILE} - ${TRACKFILE}'
ONETRACKOUTPUTFORMAT='${ARTISTFILE}/${ALBUMFILE}/${ALBUMFILE}'
PADTRACKS=y
MAXPROCS=2
EJECTCD=n           # the rip script ejects after the Jellyfin scan
INTERACTIVE=n

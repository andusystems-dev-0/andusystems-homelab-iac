# Pinned to 1.x: the uptime-kuma-api client (used by uptime-kuma-seed) only supports
# Uptime-Kuma 1.x — 2.x changed the protocol and has no stable declarative client yet.
# 1.23.x is mature/stable and fine for a homelab.
image:
  tag: "1.23.16"
volume:
  enabled: true
  storageClassName: longhorn
  size: 2Gi
resources:
  requests: { cpu: 25m, memory: 64Mi }

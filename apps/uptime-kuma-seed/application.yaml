apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-uptime-kuma-seed
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/andusystems-dev-0/andusystems-homelab-iac.git
    targetRevision: HEAD
    path: apps/uptime-kuma-seed/manifests
  destination:
    name: in-cluster
    namespace: uptime-kuma
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
# Seeds monitors into Uptime-Kuma via its API (no native declarative config).
# The Job is a PostSync hook → re-runs on every sync; the script is idempotent
# (skips monitors that already exist). Admin creds come from the uptime-kuma-admin
# secret (created by Ansible from the vault).

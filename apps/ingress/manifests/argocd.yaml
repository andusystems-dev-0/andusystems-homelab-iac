# TLS served by Traefik's default wildcard cert (*.andusystems.com) —
# see apps/traefik/manifests/wildcard-cert.yaml. No per-app Certificate needed.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  entryPoints: [websecure]
  routes:
    - match: "Host(`argocd.andusystems.com`)"
      kind: Rule
      services:
        - name: argocd-server
          port: 80
  tls:
    store:
      name: default

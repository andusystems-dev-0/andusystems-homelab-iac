apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: glance-tls
  namespace: glance
spec:
  secretName: glance-tls
  issuerRef: { name: letsencrypt, kind: ClusterIssuer }
  dnsNames: ["glance.andusystems.com"]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: glance
  namespace: glance
spec:
  entryPoints: [websecure]
  routes:
    - match: "Host(`glance.andusystems.com`)"
      kind: Rule
      services:
        - name: glance
          port: 80
  tls:
    secretName: glance-tls

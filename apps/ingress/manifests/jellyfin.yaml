apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: jellyfin-tls
  namespace: jellyfin
spec:
  secretName: jellyfin-tls
  issuerRef: { name: letsencrypt, kind: ClusterIssuer }
  dnsNames: ["jellyfin.andusystems.com"]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  entryPoints: [websecure]
  routes:
    - match: "Host(`jellyfin.andusystems.com`)"
      kind: Rule
      services:
        - name: homelab-jellyfin
          port: 8096
  tls:
    secretName: jellyfin-tls

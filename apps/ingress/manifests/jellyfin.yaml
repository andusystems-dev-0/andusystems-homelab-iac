# TLS served by Traefik's default wildcard cert (*.andusystems.com) —
# see apps/traefik/manifests/wildcard-cert.yaml. No per-app Certificate needed.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  entryPoints: [websecure]
  routes:
    - match: "Host(`jellyfin.andusystems.com`)"
      kind: Rule
      services:
        - name: homelab-jellyfin
          port: 8096
  tls:
    store:
      name: default

# TLS served by Traefik's default wildcard cert (*.andusystems.com) —
# see apps/traefik/manifests/wildcard-cert.yaml. No per-app Certificate needed.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: observability
spec:
  entryPoints: [websecure]
  routes:
    - match: "Host(`grafana.andusystems.com`)"
      kind: Rule
      services:
        - name: grafana
          port: 80
  tls: {}

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: uptime-kuma-tls
  namespace: uptime-kuma
spec:
  secretName: uptime-kuma-tls
  issuerRef: { name: letsencrypt, kind: ClusterIssuer }
  dnsNames: ["status.andusystems.com"]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
spec:
  entryPoints: [websecure]
  routes:
    - match: "Host(`status.andusystems.com`)"
      kind: Rule
      services:
        - name: homelab-uptime-kuma
          port: 3001
  tls:
    secretName: uptime-kuma-tls

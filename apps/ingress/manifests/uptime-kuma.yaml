# TLS served by Traefik's default wildcard cert (*.andusystems.com) —
# see apps/traefik/manifests/wildcard-cert.yaml. No per-app Certificate needed.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
spec:
  entryPoints: [websecure]
  routes:
    - match: "Host(`status.andusystems.com`)"
      kind: Rule
      services:
        - name: homelab-uptime-kuma
          port: 3001
  tls:
    store:
      name: default

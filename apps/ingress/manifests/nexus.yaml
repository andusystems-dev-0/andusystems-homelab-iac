# TLS served by Traefik's default wildcard cert (*.andusystems.com) —
# see apps/traefik/manifests/wildcard-cert.yaml. No per-app Certificate needed.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nexus
  namespace: nexus
spec:
  entryPoints: [websecure]
  routes:
    - match: "Host(`nexus.andusystems.com`)"
      kind: Rule
      services:
        - name: homelab-nexus-nexus-repository-manager
          port: 8081
  tls:
    store:
      name: default

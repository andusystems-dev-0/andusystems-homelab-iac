# TLS served by Traefik's default wildcard cert (*.andusystems.com) —
# see apps/traefik/manifests/wildcard-cert.yaml. No per-app Certificate needed.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: portainer
  namespace: portainer
spec:
  entryPoints: [websecure]
  routes:
    - match: "Host(`portainer.andusystems.com`)"
      kind: Rule
      services:
        - name: portainer
          port: 9000
  tls:
    store:
      name: default

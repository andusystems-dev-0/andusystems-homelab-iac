apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-loki
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki-stack
      targetRevision: 2.10.3
      helm:
        valueFiles:
          - $values/apps/loki/values.yaml
    - repoURL: https://github.com/andusystems-dev-0/andusystems-homelab-iac.git
      targetRevision: HEAD
      ref: values
  destination:
    name: in-cluster
    namespace: observability
  # k8s injects volumeMode/status/creationTimestamp into the immutable
  # StatefulSet volumeClaimTemplates the chart never renders → perpetual OutOfSync.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: loki
      jsonPointers:
        - /spec/volumeClaimTemplates
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]

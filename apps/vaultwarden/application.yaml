apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-vaultwarden
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://guerzon.github.io/vaultwarden
      chart: vaultwarden
      targetRevision: 0.46.2
      helm:
        valueFiles:
          - $values/apps/vaultwarden/values.yaml
    - repoURL: https://github.com/andusystems-dev-0/andusystems-homelab-iac.git
      targetRevision: HEAD
      ref: values
  destination:
    name: in-cluster
    namespace: vaultwarden
  # StatefulSet volumeClaimTemplates are immutable and k8s injects defaults
  # (volumeMode, status, creationTimestamp) the chart never renders → perpetual
  # OutOfSync. Ignore that path; the rest of the StatefulSet still reconciles.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: homelab-vaultwarden
      jsonPointers:
        - /spec/volumeClaimTemplates
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

# Newt reads endpoint/id/secret from the pre-created `newt-credentials` Secret
# (Ansible renders it from the gitignored vault at bootstrap). Mirrors the
# working pattern from andusystems-management.
newtInstances:
  - name: main
    enabled: true
    hostNetwork: true
    auth:
      existingSecretName: newt-credentials
      keys:
        endpointKey: newt-endpoint
        idKey: newt-id
        secretKey: newt-secret

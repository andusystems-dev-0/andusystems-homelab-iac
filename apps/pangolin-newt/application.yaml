apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-newt
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://charts.fossorial.io
      chart: newt
      targetRevision: 1.3.0
      helm:
        valueFiles:
          - $values/apps/pangolin-newt/values.yaml
    - repoURL: https://github.com/andusystems-dev-0/andusystems-homelab-iac.git
      targetRevision: HEAD
      ref: values
  destination:
    name: in-cluster
    namespace: newt
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
# NOTE: the `newt-credentials` Secret (endpoint/id/secret) is created by Ansible
# from the gitignored vault at bootstrap — never committed to this public repo.

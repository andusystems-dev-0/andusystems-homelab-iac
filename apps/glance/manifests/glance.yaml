apiVersion: v1
kind: ConfigMap
metadata:
  name: glance-config
  namespace: glance
data:
  glance.yml: |
    pages:
      - name: Home
        columns:
          - size: full
            widgets:
              - type: monitor
                title: Services
                # `url` is the click-through (external, via Pangolin); `check-url` is the
                # health probe against the in-cluster Service (reachable from this pod).
                sites:
                  - title: ArgoCD
                    url: https://argocd.andusystems.com
                    check-url: http://argocd-server.argocd.svc.cluster.local
                  - title: Grafana
                    url: https://grafana.andusystems.com
                    check-url: http://grafana.observability.svc.cluster.local
                  - title: Nexus
                    url: https://nexus.andusystems.com
                    check-url: http://homelab-nexus-nexus-repository-manager.nexus.svc.cluster.local:8081
                  - title: Portainer
                    url: https://portainer.andusystems.com
                    check-url: http://homelab-portainer.portainer.svc.cluster.local:9000
                  - title: Uptime Kuma
                    url: https://status.andusystems.com
                    check-url: http://homelab-uptime-kuma.uptime-kuma.svc.cluster.local:3001
                  - title: Vaultwarden
                    url: https://vault.andusystems.com
                    check-url: http://homelab-vaultwarden.vaultwarden.svc.cluster.local
                  - title: Jellyfin
                    url: https://jellyfin.andusystems.com
                    check-url: http://homelab-jellyfin.jellyfin.svc.cluster.local:8096
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glance
  namespace: glance
  labels: { app: glance }
spec:
  replicas: 1
  selector:
    matchLabels: { app: glance }
  template:
    metadata:
      labels: { app: glance }
      annotations:
        rollme: "checkurls-v2"
    spec:
      containers:
        - name: glance
          image: glanceapp/glance:latest
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /app/config
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 128Mi }
      volumes:
        - name: config
          configMap: { name: glance-config }
---
apiVersion: v1
kind: Service
metadata:
  name: glance
  namespace: glance
spec:
  selector: { app: glance }
  ports:
    - port: 80
      targetPort: 8080

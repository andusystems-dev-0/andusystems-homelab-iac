resources:
  requests: { cpu: 200m, memory: 512Mi }
  limits: { cpu: "2", memory: 3Gi }
persistence:
  config:
    enabled: true
    storageClass: longhorn
    size: 5Gi
  media:
    # Media lives on the persistent NAS VM over NFS (see apps/jellyfin-media) — not Longhorn.
    # Re-rippable + outside the cluster, so it survives redeploys and isn't in the S3 DR set.
    enabled: true
    existingClaim: jellyfin-media-nfs

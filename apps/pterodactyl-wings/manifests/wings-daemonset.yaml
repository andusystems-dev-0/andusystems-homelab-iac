# Wings runs as a privileged DaemonSet pinned to the primary game node (worker2 =
# homelab-k3s-2), talking to that node's Docker daemon (installed by Ansible). Game-server
# data lives on the node's big local disk via hostPath. One wings daemon == one Pterodactyl
# node; to add worker3/worker5 as extra nodes later, register them in the Panel and add a
# per-node DaemonSet with its own config secret.
#
# Two pieces are provided out-of-band (never committed to this public repo):
#   - `wings-config` Secret: config.yml with the node's daemon token (from the Panel /
#     restored DB). Created by Ansible from the vault on deploy.
#   - hostAliases for the Panel's LAN address: injected by Ansible from the vault so
#     panel<->wings control traffic stays direct on the LAN (no Pangolin hairpin). The
#     ArgoCD app ignores /spec/template/spec/template hostAliases so it won't revert it.
# TLS: the `wings-tls` cert (cert-manager, DNS-01) is mounted so the daemon serves https
# directly (browser console uses wss://).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: wings
  namespace: pterodactyl
  labels: { app: wings }
spec:
  selector:
    matchLabels: { app: wings }
  template:
    metadata:
      labels: { app: wings }
    spec:
      priorityClassName: game-critical
      nodeSelector:
        kubernetes.io/hostname: homelab-k3s-2
      hostNetwork: true
      containers:
        - name: wings
          image: ghcr.io/pterodactyl/wings:latest
          securityContext:
            privileged: true
          ports:
            - { name: daemon, containerPort: 8443, hostPort: 8443 }
            - { name: sftp, containerPort: 2022, hostPort: 2022 }
          volumeMounts:
            - { name: docker-sock, mountPath: /var/run/docker.sock }
            - { name: wings-data, mountPath: /var/lib/pterodactyl }
            - { name: wings-config, mountPath: /etc/pterodactyl }
            - { name: wings-tls, mountPath: /etc/wings-tls, readOnly: true }
            # wings spawns SIBLING containers via the host Docker socket, so any path it
            # bind-mounts into a game container must exist on the HOST at the same path.
            # /run/wings holds per-server machine-id files bind-mounted into game containers
            # (without a host share: "bind source path does not exist" → create fails).
            - { name: wings-run, mountPath: /run/wings }
            - { name: wings-tmp, mountPath: /tmp/pterodactyl }
            - { name: wings-logs, mountPath: /var/log/pterodactyl }
            # wings streams game-container console logs from the daemon's container dir.
            - { name: docker-containers, mountPath: /var/lib/docker/containers, readOnly: true }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
      volumes:
        - name: docker-sock
          hostPath: { path: /var/run/docker.sock, type: Socket }
        - name: wings-data
          hostPath: { path: /var/lib/pterodactyl, type: DirectoryOrCreate }
        - name: wings-config
          secret: { secretName: wings-config }
        - name: wings-tls
          secret: { secretName: wings-tls }
        - name: wings-run
          hostPath: { path: /run/wings, type: DirectoryOrCreate }
        - name: wings-tmp
          hostPath: { path: /tmp/pterodactyl, type: DirectoryOrCreate }
        - name: wings-logs
          hostPath: { path: /var/log/pterodactyl, type: DirectoryOrCreate }
        - name: docker-containers
          hostPath: { path: /var/lib/docker/containers, type: DirectoryOrCreate }

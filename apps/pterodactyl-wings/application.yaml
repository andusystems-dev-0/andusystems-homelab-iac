apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-pterodactyl-wings
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/andusystems-dev-0/andusystems-homelab-iac.git
    targetRevision: HEAD
    path: apps/pterodactyl-wings/manifests
  destination:
    name: in-cluster
    namespace: pterodactyl
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
# NOTE: Wings talks to the node's Docker daemon, so Ansible installs Docker on the
# game nodes (worker2/3/5, labeled `role=games`). The `wings-config` Secret (node
# token from the Panel) is created out-of-band after the node is registered — not committed.

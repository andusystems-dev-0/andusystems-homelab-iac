apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-jellyfin-seed
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/andusystems-dev-0/andusystems-homelab-iac.git
    targetRevision: HEAD
    path: apps/jellyfin-seed/manifests
  destination:
    name: in-cluster
    namespace: jellyfin
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
# Auto-runs Jellyfin's first-run setup via its API (no native declarative config):
# creates the admin user + adds the Music/Movies/Shows libraries on the NFS mount +
# schedules a frequent library scan. PostSync hook → re-runs each sync; idempotent
# (skips if the startup wizard is already done / libraries already exist), so after a
# redeploy where the Jellyfin config PVC is restored it's a clean no-op. Admin creds
# come from the jellyfin-admin secret (Ansible renders it from the gitignored vault).

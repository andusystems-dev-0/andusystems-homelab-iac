apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-traefik-config
  namespace: argocd
spec:
  project: default
  # k3s bundles Traefik; we only ship a HelmChartConfig to tune it (no separate chart).
  source:
    repoURL: https://github.com/andusystems-dev-0/andusystems-homelab-iac.git
    targetRevision: HEAD
    path: apps/traefik/manifests
  destination:
    name: in-cluster
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true

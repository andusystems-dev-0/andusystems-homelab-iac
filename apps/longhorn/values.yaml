# The pre-upgrade checker runs as a helm pre-upgrade hook that needs the Longhorn
# service account before it exists — breaks fresh ArgoCD installs. Not needed on
# first install; disable it.
preUpgradeChecker:
  jobEnabled: false

persistence:
  defaultClass: true
  defaultClassReplicaCount: 2
  reclaimPolicy: Retain

defaultSettings:
  # Bulk replicas land on the big-disk DDR3 nodes (worker3/worker5); tag them
  # `storage=bulk` at k3s install so Longhorn schedules replicas there.
  defaultReplicaCount: 2
  replicaSoftAntiAffinity: true
  storageOverProvisioningPercentage: 100
  storageMinimalAvailablePercentage: 15
  defaultDataPath: /var/lib/longhorn
  # S3 backup store for full DR. Credential secret is rendered by the Ansible secrets
  # role from the gitignored vault (IAM user longhorn-backup). Every PVC lands in the
  # `default` recurring-job group; the backup-daily RecurringJob (also applied by the
  # secrets role) snapshots + backs them up nightly with 14 restore points.
  backupTarget: s3://andusystems-longhorn-backups@us-east-1/
  backupTargetCredentialSecret: longhorn-backup-creds

longhornUI:
  replicas: 1

resources:
  requests:
    cpu: 50m
    memory: 128Mi

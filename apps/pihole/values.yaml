admin:
  existingSecret: pihole-admin
  passwordKey: password
persistentVolumeClaim:
  enabled: true
  storageClass: longhorn
  size: 1Gi
resources:
  requests: { cpu: 50m, memory: 128Mi }
DNS1: 1.1.1.1
DNS2: 8.8.8.8
# MetalLB VIPs aren't routed off VLAN 10 here (only real VM IPs are), so bind DNS to a real
# node IP:53 via a host port and pin Pi-hole to that node → clients use <node-ip>:53 as their
# upstream resolver. Pinned to homelab-k3s-4 (10.238.10.14) for a stable address.
nodeSelector:
  kubernetes.io/hostname: homelab-k3s-4
dnsHostPort:
  enabled: true
  port: 53
